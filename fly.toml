# Fly.io config. Change `app` to a unique name before `fly launch`.
app = "sail-analysis"
primary_region = "bos"

[build]

[env]
  APP_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # sleeps when idle, so it costs almost nothing
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
