{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Analyze a session</h1>
  <p class="muted">Upload a GPX track or CSV log (Vakaros, RaceSense, Njord export). Needs time, latitude and longitude columns.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/analyze" enctype="multipart/form-data">
    <input type="file" name="file" accept=".gpx,.csv" required>
    <button>Analyze</button>
  </form>
</div>
{% endblock %}
