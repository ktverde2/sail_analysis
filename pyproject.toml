[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sail-analysis"
version = "0.1.0"
description = "Private sailing data analysis tool"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "authlib>=1.3",
  "httpx>=0.27",
  "plotly>=5",  # only for its bundled plotly.min.js, served locally
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/sail_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
